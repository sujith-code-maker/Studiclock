name: Build StudiClock APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create myapp com.studiclock.app StudiClock
          cd myapp
          cordova platform add android@12.0.0
          cordova build android --debug
          mkdir -p ../output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../output/StudiClock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudiClock-APK
          path: output/StudiClock.apk
