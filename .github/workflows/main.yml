name: Build StudiClock APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Clean Build Cordova APK
        run: |
          mkdir -p /tmp/cordova_workspace
          cd /tmp/cordova_workspace
          npm install -g cordova@11.0.0
          cordova create studiclock com.studiclock.app StudiClock
          cd studiclock
          cordova platform add android@10.1.2
          cordova build android --debug
          mkdir -p $GITHUB_WORKSPACE/output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output/StudiClock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudiClock-APK
          path: output/StudiClock.apk
