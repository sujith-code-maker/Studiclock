name: Build StudiClock Real App Locker APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Prepare Project and Build APK
      run: |
        cordova create temp_app com.studiclock.app StudiClock
        cp -r www/* temp_app/www/
        cp config.xml temp_app/config.xml
        cd temp_app
        cordova platform add android
        cordova build android --debug
        mkdir -p ../output
        cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../output/StudiClock.apk

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: StudiClock-APK
        path: output/StudiClock.apk
