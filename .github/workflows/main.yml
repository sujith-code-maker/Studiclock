name: Build StudiClock APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Native Code
        run: |
          mkdir -p app/src/main/java/com/studiclock/app
          mkdir -p app/src/main/res/xml

          # settings.gradle
          echo "include ':app'" > settings.gradle

          # Root build.gradle (Android Gradle Plugin 8.0.2)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.0.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.studiclock.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.studiclock.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="StudiClock"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".WellnessService"
                      android:label="StudiClock Lock Service"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # Accessibility Config
          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="100" />
          EOF

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/com/studiclock/app/MainActivity.java
          package com.studiclock.app;
          import android.os.Bundle;
          import android.app.Activity;
          import android.widget.TextView;
          import android.view.Gravity;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("StudiClock Active!\n\nEnable 'StudiClock Lock Service' in Accessibility Settings.");
                  tv.setTextSize(18);
                  tv.setGravity(Gravity.CENTER);
                  setContentView(tv);
              }
          }
          EOF

          # Lock Engine Service
          cat << 'EOF' > app/src/main/java/com/studiclock/app/WellnessService.java
          package com.studiclock.app;
          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.content.Intent;

          public class WellnessService extends AccessibilityService {
              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      CharSequence pkgName = event.getPackageName();
                      if (pkgName != null) {
                          String app = pkgName.toString().toLowerCase();
                          if (app.contains("instagram") || app.contains("youtube") || app.contains("facebook") || app.contains("tiktok")) {
                              Intent startMain = new Intent(Intent.ACTION_MAIN);
                              startMain.addCategory(Intent.CATEGORY_HOME);
                              startMain.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(startMain);
                          }
                      }
                  }
              }
              @Override
              public void onInterrupt() {}
          }
          EOF

      # Uses Gradle 8.0 Action automatically (No local CLI bugs)
      - name: Setup & Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudiClock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
