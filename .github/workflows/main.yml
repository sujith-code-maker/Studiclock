name: Build StudiClock Real App Locker APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Create Native App Project & Build APK
      run: |
        mkdir -p android_app/app/src/main/java/com/studiclock/app
        mkdir -p android_app/app/src/main/res/layout
        mkdir -p android_app/app/src/main/res/values
        mkdir -p android_app/app/src/main/res/xml
        
        # Build Gradle Configuration
        cat << 'EOF' > android_app/build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat << 'EOF' > android_app/app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.studiclock.app'
            compileSdk 33
            defaultConfig {
                applicationId "com.studiclock.app"
                minSdk 22
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > android_app/settings.gradle
        include ':app'
        EOF

        # Android Manifest with Accessibility Permissions
        cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="StudiClock"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".WellnessService"
                    android:label="StudiClock Lock Service"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_config" />
                </service>
            </application>
        </manifest>
        EOF

        # Accessibility XML Config
        cat << 'EOF' > android_app/app/src/main/res/xml/accessibility_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canRetrieveWindowContent="false"
            android:notificationTimeout="100" />
        EOF

        # Strings & Styles
        cat << 'EOF' > android_app/app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">StudiClock</string>
        </resources>
        EOF

        # Java MainActivity
        cat << 'EOF' > android_app/app/src/main/java/com/studiclock/app/MainActivity.java
        package com.studiclock.app;
        import android.os.Bundle;
        import androidx.appcompat.app.AppCompatActivity;
        import android.widget.TextView;
        import android.graphics.Color;
        import android.view.Gravity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                TextView tv = new TextView(this);
                tv.setText("StudiClock Active!\nEnable Accessibility in Settings.");
                tv.setTextSize(22);
                tv.setTextColor(Color.BLUE);
                tv.setGravity(Gravity.CENTER);
                setContentView(tv);
            }
        }
        EOF

        # Real Accessibility Lock Service (Java)
        cat << 'EOF' > android_app/app/src/main/java/com/studiclock/app/WellnessService.java
        package com.studiclock.app;
        import android.accessibilityservice.AccessibilityService;
        import android.view.accessibility.AccessibilityEvent;
        import android.content.Intent;

        public class WellnessService extends AccessibilityService {
            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
                if (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                    CharSequence pkgName = event.getPackageName();
                    if (pkgName != null) {
                        String app = pkgName.toString();
                        if (app.contains("instagram") || app.contains("youtube") || app.contains("facebook")) {
                            Intent startMain = new Intent(Intent.ACTION_MAIN);
                            startMain.addCategory(Intent.CATEGORY_HOME);
                            startMain.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                            startActivity(startMain);
                        }
                    }
                }
            }
            @Override
            public void onInterrupt() {}
        }
        EOF

        # Build Gradle APK
        cd android_app
        gradle assembleDebug
        mkdir -p ../output
        cp app/build/outputs/apk/debug/app-debug.apk ../output/StudiClock.apk

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: StudiClock-RealAPK
        path: output/StudiClock.apk
