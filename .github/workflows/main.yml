name: Build StudiClock APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Build Cordova Android APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        npm install -g cordova
        cordova create myApp com.studiclock.app StudiClock
        cd myApp
        cp -r ../www/* www/ 2>/dev/null || true
        cp ../config.xml config.xml 2>/dev/null || true
        cordova platform add android@12.0.0
        cordova build android --debug
        mkdir -p ../output
        cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../output/StudiClock.apk

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: StudiClock-APK
        path: output/StudiClock.apk
