name: Build StudiClock Real App Locker APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Create App & Build APK
      run: |
        cordova create studiclock_app com.studiclock.app StudiClock
        cd studiclock_app
        
        # Write HTML
        cat << 'EOF' > www/index.html
        <!doctype html>
        <html>
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
            <title>StudiClock</title>
            <style>
              body { font-family: sans-serif; text-align: center; background: #f4f6f8; padding: 20px; }
              .card { background: linear-gradient(135deg, #00c6ff, #0072ff); color: #fff; padding: 30px; border-radius: 20px; margin-top: 20px; }
              button { background: #047AF1; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 16px; font-weight: bold; margin-top: 20px; }
            </style>
          </head>
          <body>
            <h1>Studic<span style="color: #003eb9">lock</span></h1>
            <div class="card">
              <h2>Apps unlocked in</h2>
              <h1 id="timer">12 hours</h1>
            </div>
            <button onclick="alert('Lock Active!')">Set New Timer Lock</button>
          </body>
        </html>
        EOF

        cordova platform add android
        cordova build android --debug
        mkdir -p ../output
        cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../output/StudiClock.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: StudiClock-APK
        path: output/StudiClock.apk
