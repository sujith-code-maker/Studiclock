name: Build StudiClock APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Cordova APK with Gradle Override
        run: |
          mkdir -p /tmp/cordova_workspace
          cd /tmp/cordova_workspace
          npm install -g cordova
          cordova create studiclock com.studiclock.app StudiClock
          cd studiclock
          
          # Add latest android platform compatible with Java 17
          cordova platform add android@12.0.0
          
          # Pass Gradle build configuration flag
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL="https\://services.gradle.org/distributions/gradle-7.6-all.zip" cordova build android --debug
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output/StudiClock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudiClock-APK
          path: output/StudiClock.apk
