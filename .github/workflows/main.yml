name: Build StudiClock APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova and Build APK
        run: |
          # 1. Install Cordova
          npm install -g cordova@12.0.0

          # 2. Create isolated project
          mkdir -p /tmp/build_dir
          cd /tmp/build_dir
          cordova create studiclock com.studiclock.app StudiClock
          cd studiclock

          # 3. Add Android Platform
          cordova platform add android@12.0.0

          # 4. Fix Gradle Version Conflict (Use Gradle 8.4 Wrapper)
          sed -i 's/gradle-.*-all.zip/gradle-8.4-bin.zip/g' platforms/android/cordova/lib/builders/ProjectBuilder.js 2>/dev/null || true
          
          # 5. Build Debug APK
          cordova build android --debug -- --gradleVersion=8.4

          # 6. Copy APK to Output
          mkdir -p $GITHUB_WORKSPACE/output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output/StudiClock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudiClock-APK
          path: output/StudiClock.apk
